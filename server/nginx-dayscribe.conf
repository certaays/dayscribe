# DayScribe - Production Nginx Configuration
# Copy this file to /etc/nginx/sites-available/dayscribe
# Then symlink: ln -s /etc/nginx/sites-available/dayscribe /etc/nginx/sites-enabled/

server {
    listen 80;
    server_name YOUR_DOMAIN_OR_IP; # Ganti dengan domain atau IP VPS kamu

    # 1. Frontend Static Files (Vite build output)
    root /var/www/dayscribe/dist;
    index index.html;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # SPA Client Routing fallback
    location / {
        try_files $uri $uri/ /index.html;
        # Jangan pernah cache index.html agar user selalu mendapat versi terbaru
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }

    # Static Assets Caching
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, no-transform, immutable";
    }

    # 2. Backend API Proxy (Forward to Node.js / PM2 on port 5000)
    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 60s;
    }
}
